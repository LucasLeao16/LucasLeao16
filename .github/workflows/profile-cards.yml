name: Gerar cards de estatísticas

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (03:00 de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cards (inclui repositórios privados via token)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Token pessoal com leitura dos repositórios privados (secret SUMMARY_GITHUB_TOKEN)
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "America/Sao_Paulo"
          THEME: "tokyonight"
